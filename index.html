<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRot Money</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .balance {
            font-size: 18px;
            color: #fbbf24;
            font-weight: bold;
        }

        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 18px;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .cases-container {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .case-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .case-card:active {
            transform: scale(0.97);
        }

        .case-icon {
            font-size: 48px;
            margin-bottom: 10px;
            text-align: center;
        }

        .case-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .case-price {
            font-size: 13px;
            color: #fbbf24;
            margin-bottom: 12px;
        }

        .open-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .open-btn:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 BRAINROT MONEY</h1>
        <div class="balance">Баланс: 🪙 <span id="balance-value">180</span></div>
    </div>

    <div class="section-title">📦 Ігрові Кейси</div>

    <div class="cases-container">
        <!-- Нубік кейс -->
        <div class="case-card">
            <div class="case-icon">📦</div>
            <div class="case-title">Нубік кейс</div>
            <div class="case-price">🪙 10</div>
            <button class="open-btn" onclick="openCase(10, 'Нубік кейс')">Відкрити</button>
        </div>
        
        <!-- Про кейс -->
        <div class="case-card">
            <div class="case-icon">🎁</div>
            <div class="case-title">Про кейс</div>
            <div class="case-price">🪙 35</div>
            <button class="open-btn" onclick="openCase(35, 'Про кейс')">Відкрити</button>
        </div>

        <!-- Сигма кейс -->
        <div class="case-card">
            <div class="case-icon">💎</div>
            <div class="case-title">Сигма кейс</div>
            <div class="case-price">🪙 80</div>
            <button class="open-btn" onclick="openCase(80, 'Сигма кейс')">Відкрити</button>
        </div>

        <!-- Легендарний кейс -->
        <div class="case-card">
            <div class="case-icon">👑</div>
            <div class="case-title">Легендарний кейс</div>
            <div class="case-price">🪙 180</div>
            <button class="open-btn" onclick="openCase(180, 'Легендарний кейс')">Відкрити</button>
        </div>
    </div>

    <script>
        let balance = 180;

        function openCase(price, caseName) {
            if (balance >= price) {
                balance -= price;
                document.getElementById('balance-value').innerText = balance;
                alert(`Ви успішно відкрили "${caseName}"! 🎉`);
            } else {
                alert('Недостатньо монет на балансі! 🪙❌');
            }
        }
    </script>

</body>
</html>
