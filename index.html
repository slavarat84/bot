<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #07090e;
            --bg-card: #111726;
            --bg-glass: rgba(17, 23, 38, 0.7);
            --gold: #f59e0b;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --neon-green: #10b981;
            --neon-red: #f43f5e;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #1a233a 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            padding: 14px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Шапка */
        .header {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .brand-user {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .balance-badge {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 900;
            color: var(--gold);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Контент вкладки */
        .tab-content {
            width: 100%;
            max-width: 440px;
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Сітки */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .case-card, .store-item, .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s, border-color 0.2s;
        }

        .case-card:active, .store-item:active {
            transform: scale(0.97);
        }

        .case-emoji, .store-emoji, .inv-emoji {
            font-size: 48px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .item-name {
            font-size: 13px;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .item-price {
            font-size: 13px;
            color: var(--gold);
            font-weight: 900;
            margin-bottom: 12px;
        }

        .btn-main {
            background: var(--gold-gradient);
            color: #0b0f19;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: opacity 0.2s;
        }

        .btn-main:active {
            opacity: 0.8;
        }

        /* Магазин */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .store-item .store-emoji { font-size: 40px; }

        /* Інвентар */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 440px;
            overflow-y: auto;
        }

        .inv-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .inv-item.selected {
            border-color: var(--gold);
            background: rgba(245, 158, 11, 0.08);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .inv-item .inv-emoji { font-size: 36px; margin-bottom: 2px; }
        .inv-title { font-size: 11px; font-weight: 700; color: #e5e7eb; margin-bottom: 2px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .inv-cost { font-size: 10px; color: var(--gold); font-weight: 800; margin-bottom: 6px; }

        .inv-btns {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .btn-sm {
            padding: 4px 2px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn-sell { background: var(--neon-red); color: white; }
        .btn-withdraw { background: #0ea5e9; color: white; }

        /* Оновлений супер-реалістичний Апгрейдер */
        .upgrade-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .upgrade-screen {
            width: 100%;
            height: 150px;
            background: radial-gradient(circle, #1f293d 0%, #0d1322 100%);
            border: 2px solid rgba(245, 158, 11, 0.3);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
        }

        .upgrade-radar {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px dashed rgba(245, 158, 11, 0.2);
            border-radius: 50%;
            animation: rotateRadar 10s linear infinite;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .upgrade-item-display {
            font-size: 54px;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--gold);
            height: 6px;
            cursor: pointer;
        }

        /* Поля вводу */
        .input-field {
            background: #090d16;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        /* Модалка кейсів */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 9, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-body {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
        }

        .roulette-box {
            width: 100%;
            height: 110px;
            background: #090d16;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin: 16px 0;
        }

        .roulette-box::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 100%;
            background: var(--neon-red);
            z-index: 10;
            box-shadow: 0 0 10px var(--neon-red);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 6px;
            transition: left 4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .roulette-card {
            min-width: 90px;
            height: 98px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-right: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .roulette-card span {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 700;
            padding: 0 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* Навігація */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 200;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 3px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item .nav-icon {
            font-size: 20px;
        }

        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid var(--border);
            gap: 10px;
        }
    </style>
</head>

    <!-- 3. ІНВЕНТАР -->

            <button class="btn-main" onclick="spinUpgrade()">ЗАПУСТИТИ АПГРЕЙД 🚀</button>
        </div>
    </div>

    <!-- 5. ПРОМОКОДИ -->
    <div id="tab-promo" class="tab-content">

        async function loadCloudData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                let data = await res.json();
                let cloudRecord = data.record || {};
                
                allPlayersData = cloudRecord.players || {};
                withdrawRequests = cloudRecord.withdraws || [];
                activeCodes = cloudRecord.codes || activeCodes;

                if (!allPlayersData[tgUser]) {
                    allPlayersData[tgUser] = { balance: 100, inventory: [], lastOnline: Date.now() };
                }

                balance = allPlayersData[tgUser].balance || 0;
                inventory = allPlayersData[tgUser].inventory || [];

                updateUI();
            } catch(e) {
                console.log("Помилка хмари:", e);
            }
        }

        async function saveCloudData() {
            if (!allPlayersData[tgUser]) allPlayersData[tgUser] = {};
            allPlayersData[tgUser].balance = balance;
            allPlayersData[tgUser].inventory = inventory;
            allPlayersData[tgUser].lastOnline = Date.now();

            let payload = {
                players: allPlayersData,
                withdraws: withdrawRequests,
                codes: activeCodes
            };

            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify(payload)
                });
            } catch(e) {
                console.log("Помилка збереження:", e);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            renderStore();
            renderInventory();
            renderCases();
            renderAdminPanel();
            saveCloudData();
        }

        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
            if(tabId === 'admin') loadCloudData();
        }

        function renderStore(filter = '') {
            const grid = document.getElementById('store-grid');
            let filtered = allBrainrots.filter(item => item.name.toLowerCase().includes(filter.toLowerCase()));
            
            grid.innerHTML = filtered.map((item) => `
                <div class="store-item">
                    <div class="store-emoji">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} 🪙</div>
                    <button class="btn-main" onclick="buyBrainrot('${item.name}', ${item.price}, '${item.icon}')">КУПИТИ</button>
                </div>
            `).join('');
        }

        function filterStore() {
            renderStore(document.getElementById('searchInput').value);
        }

        function buyBrainrot(name, price, icon) {
            if (balance < price) {
                alert('Недостатньо монет! 🪙');
                return;
            }
            balance -= price;
            let found = allBrainrots.find(x => x.name === name);
            inventory.push({ name, price, icon, rarity: found ? found.rarity : 'common' });
            updateUI();
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = '<p style="grid-column: span 3; color: var(--text-sub); font-size: 11px; text-align:center; padding:30px;">Інвентар порожній 🎒</p>';
                selectedInvIndex = null;
                updateUpgradeInfo();
                return;
            }

            list.innerHTML = inventory.map((item, index) => `
                <div class="inv-item ${selectedInvIndex === index ? 'selected' : ''}" onclick="selectItem(${index})">
                    <div class="inv-emoji">${item.icon}</div>
                    <div class="inv-title">${item.name}</div>
                    <div class="inv-cost">${item.price}🪙</div>
                    <div class="inv-btns" onclick="event.stopPropagation()">
                        <button class="btn-sm btn-sell" onclick="sellItem(${index})">Продати</button>
                        <button class="btn-sm btn-withdraw" onclick="withdrawItem(${index})">Вивід</button>
                    </div>
                </div>
            `).join('');
        }

        function selectItem(index) {
            selectedInvIndex = index;
            renderInventory();
            updateUpgradeInfo();
        }

        function sellItem(index) {
            balance += inventory[index].price;
            if (selectedInvIndex === index) selectedInvIndex = null;
            inventory.splice(index, 1);
            updateUI();
        }

        function withdrawItem(index) {
            let item = inventory[index];
            withdrawRequests.push({
                user: tgUser,
                itemName: item.name,
                itemIcon: item.icon,
                price: item.price,
                date: new Date().toLocaleTimeString()
            });
            inventory.splice(index, 1);
            if (selectedInvIndex === index) selectedInvIndex = null;
            updateUI();
            alert('Запит на вивід успішно створено! 🚀');
        }

        function renderCases() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = casesList.map(c => `
                <div class="case-card">
                    <div class="case-emoji">${c.icon}</div>
                    <div class="item-name">${c.name}</div>
                    <div class="item-price">🪙 ${c.price}</div>
                    <button class="btn-main" onclick="openCase(${c.price}, '${c.name}')">ВІДКРИТИ</button>
                </div>
            `).join('');
        }

        function getBetterRandomDrop(casePrice) {
            let minPrice = 0;
            if (casePrice >= 5000) minPrice = 180;
            else if (casePrice >= 2500) minPrice = 130;
            else if (casePrice >= 1200) minPrice = 90;
            else if (casePrice >= 750) minPrice = 70;
            else if (casePrice >= 400) minPrice = 50;
            else if (casePrice >= 200) minPrice = 35;
            else if (casePrice >= 100) minPrice = 25;

            let eligibleItems = allBrainrots.filter(x => x.price >= minPrice);
            if (eligibleItems.length === 0) eligibleItems = allBrainrots;
            return eligibleItems[Math.floor(Math.random() * eligibleItems.length)];
        }

        function openCase(price, caseName) {
            if (balance < price) {
                alert('Недостатньо монет! 🪙');
                return;
            }
            balance -= price;
            updateUI();

            const modal = document.getElementById('rouletteModal');
            const track = document.getElementById('rouletteTrack');
            const resultText = document.getElementById('winResult');

            modal.style.display = 'flex';
            resultText.innerText = '';

            let wonItem = getBetterRandomDrop(price);
            let trackHTML = '';
            for (let i = 0; i < 30; i++) {
                let randItem = (i === 15) ? wonItem : getBetterRandomDrop(price);
                trackHTML += `<div class="roulette-card">${randItem.icon}<span>${randItem.name}</span></div>`;
            }
            track.innerHTML = trackHTML;
            track.style.transition = 'none';
            track.style.left = '0px';

            setTimeout(() => {
                track.style.transition = 'left 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
                track.style.left = '-1305px'; 
            }, 50);

            setTimeout(() => {
                inventory.push(wonItem);
                updateUI();
                resultText.innerText = `Випало: ${wonItem.icon} ${wonItem.name} (${wonItem.price} 🪙)! 🎉`;
                setTimeout(() => { modal.style.display = 'none'; }, 2000);
            }, 4200);
        }

        function updateSlider(val) {
            document.getElementById('sliderVal').innerText = val + '%';
        }

        function updateUpgradeInfo() {
            const info = document.getElementById('upgrade-target-info');
            const centerIcon = document.getElementById('upgradeCenterIcon');
            if (selectedInvIndex !== null && inventory[selectedInvIndex]) {
                let item = inventory[selectedInvIndex];
                let nextItem = allBrainrots.find(x => x.price > item.price) || item;
                info.innerHTML = `Апгрейд: <b style="color:var(--gold);">${item.icon} ${item.name}</b> ➡️ <b style="color:var(--neon-green);">${nextItem.icon} ${nextItem.name}</b>`;
                centerIcon.innerText = item.icon;
            } else {
                info.innerHTML = 'Оберіть річ у вкладці інвентарю';
                centerIcon.innerText = '🎰';
            }
        }

        function spinUpgrade() {
            if (selectedInvIndex === null || !inventory[selectedInvIndex]) {
                alert('Спочатку виберіть предмет в інвентарі!');
                return;
            }

            let chance = parseInt(document.getElementById('chanceSlider').value);
            let centerIcon = document.getElementById('upgradeCenterIcon');
            
            centerIcon.style.transform = 'scale(1.4) rotate(360deg)';
            setTimeout(() => { centerIcon.style.transform = 'scale(1) rotate(0deg)'; }, 400);

            setTimeout(() => {
                let roll = Math.floor(Math.random() * 100) + 1;
                let currentItem = inventory[selectedInvIndex];

                if (roll <= chance) {
                    let upgradeTarget = allBrainrots.find(x => x.price > currentItem.price) || currentItem;
                    inventory.splice(selectedInvIndex, 1);
                    inventory.push(upgradeTarget);
                    selectedInvIndex = null;
                    alert(`УСПІХ! Отримано: ${upgradeTarget.icon} ${upgradeTarget.name} 🎉`);
                } else {
                    inventory.splice(selectedInvIndex, 1);
                    selectedInvIndex = null;
                    alert(`НЕВДАЧА! Предмет згорів у квантовій воронці 😢`);
                }
                updateUI();
            }, 500);
        }

        function activatePromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            if (activeCodes[code] !== undefined) {
                balance += activeCodes[code];
                alert(`Промокод успішно активовано! +${activeCodes[code]} 🪙`);
                delete activeCodes[code];
                updateUI();
            } else {
                alert('Невірний або використаний промокод! ❌');
            }
        }

        function checkAdminCode() {
            const inputVal = document.getElementById('admin-code-input').value.trim();
            if (inputVal === '6785431923') {
                isAdminLoggedIn = true;
                localStorage.setItem('brainrot_admin_auth', 'true');
                loadCloudData();
                alert('Адмін-доступ активовано 🔥');
            } else {
                alert('Невірний код! ❌');
            }
        }

        function renderAdminPanel() {
            const container = document.getElementById('admin-panel-container');
            
            if (!isAdminLoggedIn) {
                container.innerHTML = `
                    <div class="panel-card" style="text-align: center; gap: 12px; padding: 24px;">
                        <p style="font-size: 13px; color: var(--text-sub);">Введіть секретний код адміністратора:</p>
                        <input type="password" id="admin-code-input" class="input-field" placeholder="••••••••••" style="text-align: center;">
                        <button class="btn-main" onclick="checkAdminCode()">УВІЙТИ В АДМІНКУ</button>
                    </div>
                `;
                return;
            }

            let withdrawRows = '';
            if (withdrawRequests.length === 0) {
                withdrawRows = `<div style="text-align:center; padding:12px; color:var(--text-sub); font-size:11px;">Немає активних заяв на вивід 📭</div>`;
            } else {
                withdrawRows = withdrawRequests.map((req, idx) => `
                    <div class="admin-row" style="border-color:var(--gold);">
                        <div><b>@${req.user}</b> виводить: <span style="color:var(--gold);">${req.itemIcon} ${req.itemName}</span><br><span style="font-size:10px; color:var(--text-sub);">${req.date}</span></div>
                        <button class="btn-main" style="width: auto; padding: 6px 12px; background: var(--neon-green); color: #000;" onclick="completeWithdraw(${idx})">ВИДАНО ✅</button>
                    </div>
                `).join('');
            }

            container.innerHTML = `
                <div class="panel-card" style="gap: 14px; width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <span style="font-size: 13px; font-weight: 900; color: var(--gold);">📦 ЗАЯВКИ НА ВИВІД (${withdrawRequests.length})</span>
                        <button class="btn-main" style="width: auto; padding: 4px 8px; font-size: 10px; background: var(--neon-red); color: white;" onclick="adminLogout()">Вийти</button>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; width:100%;">
                        ${withdrawRows}
                    </div>
                    <hr style="border-color: var(--border); width: 100%;">
                    <span style="font-size: 13px; font-weight: 900; color: var(--gold); text-align: left; width: 100%;">🎟️ СТВОРЕННЯ ПРОМОКОДУ</span>
                    <input type="text" id="new-promo-name" class="input-field" placeholder="Назва промокоду (напр. PROMO100)">
                    <input type="number" id="new-promo-sum" class="input-field" placeholder="Сума монет">
                    <button class="btn-main" onclick="adminCreatePromo()">СТВОРИТИ ПРОМОКОД</button>
                </div>
            `;
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            localStorage.removeItem('brainrot_admin_auth');
            renderAdminPanel();
        }

        function completeWithdraw(index) {
            withdrawRequests.splice(index, 1);
            saveCloudData();
            renderAdminPanel();
            alert('Запит позначено як виданий!');
        }

        function adminCreatePromo() {
            const name = document.getElementById('new-promo-name').value.trim().toUpperCase();
            const sum = parseInt(document.getElementById('new-promo-sum').value);
            if (!name || isNaN(sum)) return alert('Заповніть усі поля коректно!');
            activeCodes[name] = sum;
            saveCloudData();
            alert(`Промокод "${name}" на ${sum} монет успішно створено! 🎟️`);
            document.getElementById('new-promo-name').value = '';
            document.getElementById('new-promo-sum').value = '';
        }

        loadCloudData();
    </script>
