<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Case Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #111318;
            --bg-surface: #1a1d24;
            --bg-card: #222630;
            --accent: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --rarity-gray: #b0b0b0;
            --rarity-blue: #3498db;
            --rarity-purple: #9b59b6;
            --rarity-pink: #e056fd;
            --rarity-gold: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            padding: 16px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand-title {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .brand-user {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .balance-pill {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--accent);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-content {
            width: 100%;
            max-width: 420px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }

        .card:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .item-emoji {
            font-size: 42px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .item-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-price {
            font-size: 13px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .btn {
            background: var(--accent-gradient);
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .back-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .chances-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chance-row {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 440px;
            overflow-y: auto;
        }

        .inv-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .inv-card.selected {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.05);
        }

        .inv-emoji { font-size: 28px; margin-bottom: 4px; }
        .inv-name { font-size: 10px; font-weight: 700; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
        .inv-cost { font-size: 10px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }

        .inv-actions {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .btn-micro {
            padding: 4px 2px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn-sell { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-withdraw { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        /* Стилі для нового дизайну апгрейдера (як на фото) */
        .upgrade-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .upgrade-block {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 140px;
            justify-content: center;
        }

        .block-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .block-plus {
            font-size: 24px;
            color: var(--border);
        }

        .target-label {
            font-size: 10px;
            color: var(--border);
        }

        .wheel-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .wheel-pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--success);
            z-index: 20;
        }

        .wheel-display {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 4px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: transform 2.5s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .wheel-center {
            width: 60px;
            height: 60px;
            background: var(--bg-surface);
            border: 3px solid var(--border);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .wheel-chance-title {
            font-size: 7px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .wheel-chance-value {
            font-size: 14px;
            font-weight: 800;
            color: var(--success);
        }

        .wheel-marker {
            position: absolute;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .marker-top { top: 4px; left: 50%; transform: translateX(-50%); }
        .marker-right { right: 4px; top: 50%; transform: translateY(-50%); }
        .marker-bottom { bottom: 4px; left: 50%; transform: translateX(-50%); }
        .marker-left { left: 4px; top: 50%; transform: translateY(-50%); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 340px;
            text-align: center;
        }

        .roulette-wrap {
            width: 100%;
            height: 90px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 14px 0;
        }

        .roulette-wrap::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 100%;
            background: var(--accent);
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 4px;
            transition: left 3.5s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .roulette-item {
            min-width: 80px;
            height: 80px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-right: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .roulette-item span {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 2px;
        }

        .nav-dock {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 200;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 3px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-btn.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="brand-title">Brainrot Case Battle</div>
            <div class="brand-user" id="username-display">@player</div>
        </div>
        <div class="balance-pill">🪙 <span id="balance">0</span></div>
    </div>

    <!-- 1. КЕЙСИ -->
    <div id="tab-cases" class="tab-content active">
        <div class="section-title">Доступні кейси</div>
        <div class="grid-2" id="cases-grid"></div>
    </div>

    <!-- 1.1 ПЕРЕГЛЯД КЕЙСУ -->
    <div id="tab-case-view" class="tab-content">
        <div class="back-row">
            <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="goBackToCases()">← Назад</button>
            <div class="section-title" id="view-case-title" style="margin-bottom:0;">Кейс</div>
        </div>
        <div class="card" style="padding: 20px; gap: 8px;">
            <div id="view-case-emoji" style="font-size: 56px;">🎁</div>
            <div id="view-case-name" style="font-size: 16px; font-weight: 800;">Назва</div>
            <div id="view-case-price" style="font-size: 14px; color: var(--accent); font-weight: 700;">Ціна: 0 🪙</div>
            <button class="btn" onclick="openCurrentCase()">ВІДКРИТИ КЕЙС</button>
        </div>
        <div class="section-title">Вміст кейсу та шанси</div>
        <div class="chances-list" id="case-chances-list"></div>
    </div>

    <!-- 2. РИНОК -->
    <div id="tab-store" class="tab-content">
        <div class="section-title">Магазин брейнротів</div>
        <input type="text" id="searchInput" class="input-field" placeholder="🔍 Пошук персонажа..." oninput="filterStore()">
        <div class="store-grid" id="store-grid"></div>
    </div>

    <!-- 3. ІНВЕНТАР -->
    <div id="tab-inventory" class="tab-content">
        <div class="section-title">Сховище предметів</div>
        <div class="inventory-grid" id="inventory-list"></div>
    </div>

    <!-- 4. АПГРЕЙДЕР -->
    <div id="tab-upgrade" class="tab-content">
        <div class="section-title">Апгрейдер (Як на фото)</div>
        <div class="upgrade-layout">
            
            <div class="upgrade-block">
                <div class="block-title">ТВОЙ ВКЛАД</div>
                <div class="block-plus" id="invBlockIcon">📥</div>
                <div class="inv-emoji" id="invBlockEmoji"></div>
                <div class="inv-cost" id="invBlockCost"></div>
            </div>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel-display" id="wheelBox">
                    <div class="wheel-marker marker-top">💀</div>
                    <div class="wheel-marker marker-right">💀</div>
                    <div class="wheel-marker marker-bottom">💀</div>
                    <div class="wheel-marker marker-left">💀</div>
                    <div class="wheel-center">
                        <div class="wheel-chance-title">ШАНС</div>
                        <div class="wheel-chance-value" id="wheelChance">0%</div>
                    </div>
                </div>
            </div>

            <div class="upgrade-block">
                <div class="block-title">ЖЕЛАЕМЫЙ ПРЕДМЕТ</div>
                <div class="inv-emoji" id="targetBlockEmoji"></div>
                <div class="inv-cost" id="targetBlockCost"></div>
                <div class="target-label" id="targetBlockLabel">ВЫБРАТЬ ЦЕЛЬ</div>
            </div>

        </div>
        <button class="btn" style="margin-top: 10px;" onclick="spinUpgrade()">ПРОКАЧАТЬ</button>
    </div>

    <!-- 5. ПРОМОКОДИ -->
    <div id="tab-promo" class="tab-content">
        <div class="section-title">Активація промокоду</div>
        <div class="card" style="gap: 12px; width: 100%; align-items: flex-start;">
            <p style="font-size: 11px; color: var(--text-secondary);">Введіть секретний код для отримання монет:</p>
            <input type="text" id="promo-input" class="input-field" placeholder="ПРОМОКОД">
            <button class="btn" onclick="activatePromo()">АКТИВУВАТИ</button>
        </div>
    </div>

    <!-- МОДАЛКА РУЛЕТКИ КЕЙСУ -->
    <div id="rouletteModal" class="modal">
        <div class="modal-box">
            <h3 style="color: var(--accent); font-size: 15px; font-weight: 800; margin-bottom: 4px;">ВІДКРИТТЯ КЕЙСУ</h3>
            <div class="roulette-wrap">
                <div id="rouletteTrack" class="roulette-track"></div>
            </div>
            <p id="winResult" style="font-weight: 800; color: var(--accent); min-height: 20px; font-size: 13px;"></p>
        </div>
    </div>

    <!-- НИЖНЯ ПАНЕЛЬ -->
    <div class="nav-dock">
        <button class="nav-btn active" onclick="switchTab('cases', this)"><div class="nav-icon">🎁</div>Кейси</button>
        <button class="nav-btn" onclick="switchTab('store', this)"><div class="nav-icon">🛒</div>Ринок</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)"><div class="nav-icon">🎒</div>Сховище</button>
        <button class="nav-btn" onclick="switchTab('upgrade', this)"><div class="nav-icon">🎯</div>Апгрейд</button>
        <button class="nav-btn" onclick="switchTab('promo', this)"><div class="nav-icon">🎟️</div>Коди</button>
    </div>

            { name: 'Dragon Canelonni', price: 967, emoji: '🐉', rarity: '--rarity-gold' }
        ];

        const casesList = [
            { id: 0, name: 'Free Case', price: 0, emoji: '🎁', isFree: true, items: [0, 1, 2, 3, 4] },
            { id: 1, name: 'Start Box', price: 5, emoji: '🧪', items: [5, 6, 7, 8, 9] },
            { id: 2, name: 'S-Case', price: 9, emoji: '🥈', items: [10, 11, 12, 13, 14] },
            { id: 3, name: 'G-Case', price: 19, emoji: '🥇', items: [15, 16, 17, 18, 19] },
            { id: 4, name: 'A-Case', price: 29, emoji: '🥉', items: [20, 21, 22, 23, 24] },
            { id: 5, name: 'Mega Box', price: 49, emoji: '📦', items: [25, 26, 27, 28, 29] },
            { id: 6, name: 'Swag Case', price: 100, emoji: '😎', items: [30, 31, 32, 33, 34] },
            { id: 7, name: 'Moby Case', price: 200, emoji: '⚓', items: [35, 36, 37, 38, 39] },
            { id: 8, name: 'Dragon Box', price: 500, emoji: '🌟', items: [40, 41, 42, 43, 44] }
        ];

        const chancesGradient = [50, 25, 15, 8, 2]; // 50%, 25%, 15%, 8%, 2%

        function saveData() {
            localStorage.setItem('br_balance_' + tgUser, balance);
            localStorage.setItem('br_inv_' + tgUser, JSON.stringify(inventory));
            localStorage.setItem('br_promo', JSON.stringify(promoCodes));
            localStorage.setItem('br_free_case_' + tgUser, lastFreeCaseTime);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            renderInventory();
            renderCases();
            saveData();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function renderCases() {
            const grid = document.getElementById('cases-grid');
            let now = Date.now();
            let timeLeft = lastFreeCaseTime + 12 * 3600 * 1000 - now;
            let freeReady = timeLeft <= 0;

            grid.innerHTML = casesList.map(c => {
                let priceText = c.isFree ? (freeReady ? 'READY' : Math.ceil(timeLeft/3600000) + 'H') : c.price + ' 🪙';
                return `
                    <div class="card" onclick="viewCase(${c.id})">
                        <div class="item-emoji">${c.emoji}</div>
                        <div class="item-name">${c.name}</div>
                        <div class="item-price">${priceText}</div>
                    </div>
                `;
            }).join('');
        }

        function viewCase(caseId) {
            let c = casesList.find(c => c.id === caseId);
            switchTab('case-view');
            document.getElementById('view-case-title').innerText = c.name;
            document.getElementById('view-case-emoji').innerText = c.emoji;
            document.getElementById('view-case-name').innerText = c.name;
            document.getElementById('view-case-price').innerText = c.isFree ? 'PRICE: FREE' : 'PRICE: ' + c.price + ' 🪙';

            let chancesList = document.getElementById('case-chances-list');
            chancesList.innerHTML = c.items.map((itemId, index) => {
                let item = allBrainrots[itemId];
                return `
                    <div class="chance-row">
                        <span>${item.name}</span>
                        <span style="font-weight:700; color: var(--rarity-gold)">${chancesGradient[index]}%</span>
                    </div>
                `;
            }).join('');
        }

        function openCurrentCase() {
            let cName = document.getElementById('view-case-name').innerText;
            let c = casesList.find(c => c.name === cName);
            if (c.isFree) {
                let now = Date.now();
                if (now < lastFreeCaseTime + 12 * 3600 * 1000) return alert('CASE ON COOLDOWN');
                lastFreeCaseTime = now;
            } else {
                if (balance < c.price) return alert('NOT ENOUGH BALANCE');
                balance -= c.price;
            }
            updateUI();

            // Рулетка
            const modal = document.getElementById('rouletteModal');
            modal.style.display = 'flex';
            document.getElementById('winResult').innerText = '';
            
            // Визначення предмета на основі шансів
            let rand = Math.random() * 100;
            let itemIndex = 0;
            let currentChance = 0;
            for (let i = 0; i < chancesGradient.length; i++) {
                currentChance += chancesGradient[i];
                if (rand < currentChance) {
                    itemIndex = i;
                    break;
                }
            }
            let wonItemId = c.items[itemIndex];
            let wonItem = allBrainrots[wonItemId];

            // Анімація рулетки (спрощена)
            let track = document.getElementById('rouletteTrack');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.left = '0';
            let rouletteItems = [];
            for (let i = 0; i < 30; i++) {
                let randId = c.items[Math.floor(Math.random() * 5)];
                rouletteItems.push(allBrainrots[randId]);
            }
            rouletteItems[25] = wonItem; // Предмет для зупинки

            track.innerHTML = rouletteItems.map(item => `
                <div class="roulette-item">
                    <span style="font-size: 20px">${item.emoji}</span>
                </div>
            `).join('');

            setTimeout(() => {
                track.style.transition = 'left 3s cubic-bezier(0.1, 0.9, 0.2, 1)';
                track.style.left = '-2150px';
            }, 50);

            setTimeout(() => {
                inventory.push(wonItem);
                updateUI();
                document.getElementById('winResult').innerText = 'WON: ' + wonItem.name + ' (' + wonItem.price + ' 🪙)';
                setTimeout(() => modal.style.display = 'none', 1500);
            }, 3200);
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = inventory.map((item, index) => `
                <div class="inv-card" onclick="selectItem(${index})">
                    <div class="inv-emoji">${item.emoji}</div>
                    <div class="inv-name">${item.name}</div>
                    <div class="inv-cost">${item.price}🪙</div>
                    <button class="btn-micro btn-sell" onclick="sellItem(${index})">SELL</button>
                </div>
            `).join('');
        }

        function sellItem(index) {
            event.stopPropagation();
            balance += inventory[index].price;
            inventory.splice(index, 1);
            updateUI();
        }

        function activatePromo() {
            const code = document.getElementById('promo-input').value.toUpperCase();
            if (promoCodes[code]) {
                balance += promoCodes[code];
                alert('PROMO ACTIVATED! +' + promoCodes[code]);
                delete promoCodes[code];
                updateUI();
            } else {
                alert('INVALID CODE');
            }
        }

        // Логіка нового апгрейдера
        function selectItem(index) {
            selectedInvIndex = index;
            updateUI(); // Щоб оновити стилі інвентаря
            const item = inventory[index];

            // Оновити блок вкладу
            document.getElementById('invBlockIcon').style.display = 'none';
            document.getElementById('invBlockEmoji').innerText = item.emoji;
            document.getElementById('invBlockCost').innerText = item.price + ' 🪙';

            // Знайти ціль (наступний предмет за ціною)
            currentUpgradeTarget = allBrainrots.find(target => target.price > item.price);
            if (currentUpgradeTarget) {
                // Оновити блок цілі
                document.getElementById('targetBlockLabel').innerText = 'ЦЕЛЬ';
                document.getElementById('targetBlockEmoji').innerText = currentUpgradeTarget.emoji;
                document.getElementById('targetBlockCost').innerText = currentUpgradeTarget.price + ' 🪙';

                // Розрахувати шанс
                currentUpgradeChance = Math.max(1, Math.min(99, Math.floor((item.price / currentUpgradeTarget.price) * 100)));
                document.getElementById('wheelChance').innerText = currentUpgradeChance + '%';
                updateWheelVisuals();
            } else {
                // Немає дорожчого предмета
                document.getElementById('wheelChance').innerText = '--%';
                currentUpgradeChance = 0;
            }
        }

        function updateWheelVisuals() {
            // Спрощений візуал шансу на основі border-box
            let wheel = document.getElementById('wheelBox');
            let deg = (currentUpgradeChance / 100) * 360;
            // Бордер-бокс градієнт
            wheel.style.backgroundImage = `conic-gradient(var(--success) 0deg ${deg}deg, var(--danger) ${deg}deg 360deg)`;
        }

        function spinUpgrade() {
            if (selectedInvIndex === null || currentUpgradeChance === 0) return alert('SELECT ITEM TO UPGRADE');
            if (balance < 1) return alert('NEED MIN 1 🪙'); // Невелика плата за апгрейд
            balance -= 1;
            updateUI();

            let now = Date.now();
            if (now < freeUpgradeTimer + freeUpgradeCooldown) {
                if (balance < freeUpgradeCost) return alert('NEED ' + freeUpgradeCost + ' 🪙 FOR QUICK UPGRADE');
                balance -= freeUpgradeCost;
            }
            freeUpgradeTimer = now;
            updateUI();

            // Анімація
            let wheel = document.getElementById('wheelBox');
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            setTimeout(() => {
                wheel.style.transition = 'transform 2.5s cubic-bezier(0.1, 0.9, 0.2, 1)';
                let roll = Math.random() * 100;
                let finalDeg = (Math.random() < currentUpgradeChance / 100) ? 
                    (Math.random() * ((currentUpgradeChance / 100) * 360)) :
                    (Math.random() * ((1 - currentUpgradeChance / 100) * 360)) + ((currentUpgradeChance / 100) * 360);

                // Додати 4 повних оберти
                wheel.style.transform = `rotate(${1440 + finalDeg}deg)`;

                setTimeout(() => {
                    if (roll < currentUpgradeChance) {
                        alert('UPGRADE SUCCESSFUL! WIN: ' + currentUpgradeTarget.name);
                        inventory.splice(selectedInvIndex, 1, currentUpgradeTarget);
                    } else {
                        alert('UPGRADE FAILED!');
                        inventory.splice(selectedInvIndex, 1);
                    }
                    saveData();
                    switchTab('inventory');
                    updateUI();
                }, 2600);
            }, 50);
        }

        updateUI();
    </script>
</body>
</html>
