<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Battle Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --gold: #fbbf24;
            --green: #22c55e;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .brand-title {
            font-weight: 900;
            font-size: 17px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .brand-user {
            font-size: 11px;
            color: var(--text-sub);
        }

        .balance-box {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            color: var(--gold);
            font-size: 14px;
        }

        .tab-content {
            width: 100%;
            max-width: 450px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .case-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .case-icon {
            font-size: 42px;
            margin: 4px 0;
        }

        .case-name {
            font-size: 13px;
            font-weight: 800;
            color: white;
            margin-bottom: 2px;
        }

        .case-price {
            font-size: 12px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .store-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .store-icon {
            font-size: 34px;
            margin-bottom: 4px;
        }

        .store-name {
            font-size: 11px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .store-price {
            font-size: 12px;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
        }

        .inv-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .inv-item.selected {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .inv-icon {
            font-size: 30px;
            margin-bottom: 2px;
        }

        .inv-title {
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .inv-actions {
            display: flex;
            gap: 3px;
            width: 100%;
        }

        .btn-sell {
            background: var(--red);
            color: white;
            border: none;
            padding: 3px 4px;
            border-radius: 5px;
            font-size: 8px;
            font-weight: 800;
            cursor: pointer;
            flex: 1;
        }

        .btn-withdraw {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 3px 4px;
            border-radius: 5px;
            font-size: 8px;
            font-weight: 800;
            cursor: pointer;
            flex: 1;
        }

        .upgrade-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .wheel-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-arrow {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 15px solid var(--gold);
            z-index: 40;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
        }

        .wheel-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid #1e293b;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .wheel-center {
            width: 54px;
            height: 54px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 3px solid var(--gold);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .slider-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            font-size: 12px;
            color: var(--text-sub);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-field {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        .online-user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid var(--border);
            gap: 6px;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .btn-mini {
            background: var(--gold);
            color: black;
            border: none;
            padding: 3px 6px;
            border-radius: 5px;
            font-weight: 800;
            font-size: 10px;
            cursor: pointer;
        }

        .access-denied {
            color: var(--red);
            font-weight: 900;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-body {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .roulette-wrapper {
            width: 100%;
            height: 100px;
            background: var(--bg-color);
            border: 2px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 14px 0;
        }

        .roulette-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 100%;
            background: var(--red);
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 4px;
            transition: left 4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .roulette-card {
            min-width: 85px;
            height: 90px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-right: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .roulette-card span {
            font-size: 9px;
            color: var(--text-sub);
            margin-top: 2px;
            font-weight: 700;
        }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
            font-weight: 700;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item div {
            font-size: 18px;
        }
    </style>
</head>
<body>

        <div class="cases-grid" id="cases-grid"></div>
    </div>

    <!-- 2. МАГАЗИН -->

        <div class="store-grid" id="store-grid"></div>
    </div>

    <!-- 3. ІНВЕНТАР -->
    <div id="tab-inventory" class="tab-content">
        <div class="section-title">🎒 Ваш інвентар</div>
        <div class="inventory-grid" id="inventory-list"></div>
    </div>

    <!-- 4. АПГРЕЙДЕР -->
    <div id="tab-upgrade" class="tab-content">
        <div class="section-title">⚡ Апгрейд Брейнротів</div>
        <div class="upgrade-card">

            <div class="wheel-wrapper">
                <div class="wheel-arrow"></div>
                <div class="wheel-container" id="fortuneWheel">

                </div>
            </div>

            <div class="slider-box">
                <label for="chanceSlider">Шанс успіху: <span id="sliderVal" style="color: var(--gold); font-weight: 900;">50</span>%</label>
                <input type="range" id="chanceSlider" min="10" max="90" value="50" oninput="updateSlider(this.value)">
            </div>

            <button class="btn-primary" onclick="spinWheel()" style="width: 100%;">Зробити Апгрейд 🚀</button>
        </div>
    </div>

    <!-- 5. ПРОМОКОДИ -->
    <div id="tab-promo" class="tab-content">
        <div class="section-title">🎟️ Активація Промокодів</div>
        <div class="panel-card">
            <p style="font-size: 12px; color: var(--text-sub);">Введіть секретний промокод:</p>
            <input type="text" id="promo-input" class="input-field" placeholder="Наприклад: SKIBIDI">
            <button class="btn-primary" onclick="activatePromo()">Активувати промокод</button>
        </div>
    </div>

    <!-- 6. АДМІН-ПАНЕЛЬ (ЗАХИЩЕНА КОДОМ) -->

            <div class="roulette-wrapper">

            </div>
            <p id="winResult" style="font-weight: 800; color: var(--gold); min-height: 22px; font-size: 13px;"></p>
        </div>
    </div>

        const casesList = [
            { id: 1, name: 'Нубік Бокс', price: 10, icon: '📦' },
            { id: 2, name: 'Скібіді Кейс', price: 25, icon: '🚽' },
            { id: 3, name: 'Сакура Бокс', price: 50, icon: '🌸' },
            { id: 4, name: 'Сигма Кейс', price: 100, icon: '🗿' },
            { id: 5, name: 'Тун-Тун Бокс', price: 200, icon: '🎵' },
            { id: 6, name: 'Альфа Кейс', price: 400, icon: '🔥' },
            { id: 7, name: 'Елітний Бокс', price: 750, icon: '💎' },
            { id: 8, name: 'Космічний Кейс', price: 1200, icon: '🚀' },
            { id: 9, name: 'GigaChad Бокс', price: 2500, icon: '👑' },
            { id: 10, name: 'BrainRot Ultra', price: 5000, icon: '🌀' }
        ];

        let activePlayers = JSON.parse(localStorage.getItem('brainrot_online_players')) || [
            { username: tgUser, balance: balance, inventoryCount: inventory.length }
        ];

        let activeCodes = JSON.parse(localStorage.getItem('brainrot_codes')) || { 'SKIBIDI': 200, 'LERYTOK': 1000, 'BRAINROT': 500 };

        function saveState() {
            localStorage.setItem('brainrot_balance', balance);
            localStorage.setItem('brainrot_inventory', JSON.stringify(inventory));
            localStorage.setItem('brainrot_withdraws', JSON.stringify(withdrawRequests));
            localStorage.setItem('brainrot_codes', JSON.stringify(activeCodes));
            
            let pIndex = activePlayers.findIndex(p => p.username === tgUser);
            if (pIndex !== -1) {
                activePlayers[pIndex].balance = balance;
                activePlayers[pIndex].inventoryCount = inventory.length;
            } else {
                activePlayers.push({ username: tgUser, balance: balance, inventoryCount: inventory.length });
            }
            localStorage.setItem('brainrot_online_players', JSON.stringify(activePlayers));
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            renderStore();
            renderInventory();
            renderCases();
            renderAdminPanel();
            saveState();
        }

        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderStore(filter = '') {
            const grid = document.getElementById('store-grid');
            let filtered = allBrainrots.filter(item => item.name.toLowerCase().includes(filter.toLowerCase()));
            
            grid.innerHTML = filtered.map((item) => `
                <div class="store-item">
                    <div class="store-icon">${item.icon}</div>
                    <div class="store-name">${item.name}</div>
                    <div class="store-price">${item.price} 🪙</div>
                    <button class="btn-primary" onclick="buyBrainrot('${item.name}', ${item.price}, '${item.icon}')">Купити</button>
                </div>
            `).join('');
        }

        function filterStore() {
            let val = document.getElementById('searchInput').value;
            renderStore(val);
        }

        function buyBrainrot(name, price, icon) {
            if (balance < price) {
                alert('Недостатньо монет! Попросіть в адміна або активуйте промокод 🪙');
                return;
            }
            balance -= price;
            let found = allBrainrots.find(x => x.name === name);
            inventory.push({ name, price, icon, rarity: found ? found.rarity : 'common' });
            updateUI();
            alert(`Успішно куплено: ${icon} ${name}!`);
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = '<p style="grid-column: span 3; color: var(--text-sub); font-size: 11px; text-align:center; padding:20px;">Інвентар порожній 🎒</p>';
                selectedInvIndex = null;
                updateUpgradeInfo();
                return;
            }

            list.innerHTML = inventory.map((item, index) => `
                <div class="inv-item ${selectedInvIndex === index ? 'selected' : ''}" onclick="selectItem(${index})">
                    <div class="inv-icon">${item.icon}</div>
                    <div class="inv-title">${item.name}</div>
                    <div style="font-size: 10px; color: var(--gold); margin-bottom: 4px;">${item.price}🪙</div>
                    <div class="inv-actions" onclick="event.stopPropagation()">
                        <button class="btn-sell" onclick="sellItem(${index})">Продати</button>
                        <button class="btn-withdraw" onclick="withdrawItem(${index})">Вивести</button>
                    </div>
                </div>
            `).join('');
        }

        function selectItem(index) {
            selectedInvIndex = index;
            renderInventory();
            updateUpgradeInfo();
        }

        function sellItem(index) {
            balance += inventory[index].price;
            if (selectedInvIndex === index) selectedInvIndex = null;
            inventory.splice(index, 1);
            updateUI();
        }

        function withdrawItem(index) {
            let item = inventory[index];
            withdrawRequests.push({
                user: tgUser,
                itemName: item.name,
                itemIcon: item.icon,
                price: item.price,
                date: new Date().toLocaleTimeString()
            });
            inventory.splice(index, 1);
            if (selectedInvIndex === index) selectedInvIndex = null;
            updateUI();
            alert('Ваше замовлення на вивід передано адміністратору! 🚀');
        }

        function renderCases() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = casesList.map(c => `
                <div class="case-card">
                    <div class="case-icon">${c.icon}</div>
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">🪙 ${c.price}</div>
                    <button class="btn-primary" onclick="openCase(${c.price}, '${c.name}')">Відкрити</button>
                </div>
            `).join('');
        }

        function getBetterRandomDrop(casePrice) {
            let minPrice = 0;
            if (casePrice >= 5000) minPrice = 180;
            else if (casePrice >= 2500) minPrice = 130;
            else if (casePrice >= 1200) minPrice = 90;
            else if (casePrice >= 750) minPrice = 70;
            else if (casePrice >= 400) minPrice = 50;
            else if (casePrice >= 200) minPrice = 35;
            else if (casePrice >= 100) minPrice = 25;

            let eligibleItems = allBrainrots.filter(x => x.price >= minPrice);
            if (eligibleItems.length === 0) eligibleItems = allBrainrots;

            let roll = Math.random() * 100;
            let rares = eligibleItems.filter(x => x.rarity === 'rare');
            if (roll < 15 && rares.length > 0) {
                return rares[Math.floor(Math.random() * rares.length)];
            }

            return eligibleItems[Math.floor(Math.random() * eligibleItems.length)];
        }

        function openCase(price, caseName) {
            if (balance < price) {
                alert('Недостатньо монет для відкриття кейсу! 🪙');
                return;
            }
            balance -= price;
            updateUI();

            const modal = document.getElementById('rouletteModal');
            const track = document.getElementById('rouletteTrack');
            const resultText = document.getElementById('winResult');

            modal.style.display = 'flex';
            resultText.innerText = '';

            let wonItem = getBetterRandomDrop(price);

            let trackHTML = '';
            for (let i = 0; i < 30; i++) {
                let randItem = (i === 15) ? wonItem : getBetterRandomDrop(price);
                trackHTML += `<div class="roulette-card">${randItem.icon}<span>${randItem.name}</span></div>`;
            }
            track.innerHTML = trackHTML;
            track.style.transition = 'none';
            track.style.left = '0px';

            setTimeout(() => {
                track.style.transition = 'left 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
                track.style.left = '-1305px'; 
            }, 50);

            setTimeout(() => {
                inventory.push(wonItem);
                updateUI();
                resultText.innerText = `Випало: ${wonItem.icon} ${wonItem.name} (${wonItem.price} 🪙)! 🎉`;
                setTimeout(() => { modal.style.display = 'none'; }, 2000);
            }, 4200);
        }

        function updateSlider(val) {
            document.getElementById('sliderVal').innerText = val;
            updateWheelGradient(val);
        }

        function updateWheelGradient(chance) {
            let wheel = document.getElementById('fortuneWheel');
            let deg = (chance / 100) * 360;
            wheel.style.background = `conic-gradient(var(--green) 0deg ${deg}deg, var(--red) ${deg}deg 360deg)`;
        }

        function updateUpgradeInfo() {
            const info = document.getElementById('upgrade-target-info');
            const centerIcon = document.getElementById('wheelCenterIcon');
            if (selectedInvIndex !== null && inventory[selectedInvIndex]) {
                let item = inventory[selectedInvIndex];
                let nextItem = allBrainrots.find(x => x.price > item.price) || item;
                info.innerHTML = `Апгрейд: <b style="color:var(--gold);">${item.icon} ${item.name}</b> ➡️ <b style="color:var(--green);">${nextItem.icon} ${nextItem.name}</b>`;
                centerIcon.innerText = item.icon;
            } else {
                info.innerHTML = 'Виберіть предмет у вкладці "Інвентар"';
                centerIcon.innerText = '🎰';
            }
        }

        function spinWheel() {
            if (selectedInvIndex === null || !inventory[selectedInvIndex]) {
                alert('Спочатку виберіть предмет у вкладці "Інвентар"!');
                return;
            }

            let chance = parseInt(document.getElementById('chanceSlider').value);
            let wheel = document.getElementById('fortuneWheel');
            
            let roll = Math.floor(Math.random() * 100) + 1;
            let isSuccess = roll <= chance;

            let targetDegree;
            let extraSpins = 360 * 6;

            if (isSuccess) {
                let randomGreenAngle = Math.random() * (chance * 3.6 - 10) + 5;
                targetDegree = extraSpins + randomGreenAngle;
            } else {
                let randomRedAngle = Math.random() * ((100 - chance) * 3.6 - 10) + (chance * 3.6 + 5);
                targetDegree = extraSpins + randomRedAngle;
            }

            wheel.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                let currentItem = inventory[selectedInvIndex];

                if (isSuccess) {
                    let upgradeTarget = allBrainrots.find(x => x.price > currentItem.price);
                    if (!upgradeTarget) upgradeTarget = currentItem;

                    inventory.splice(selectedInvIndex, 1);
                    inventory.push(upgradeTarget);
                    selectedInvIndex = null;
                    alert(`Успіх! Отримано новий брейнрот: ${upgradeTarget.icon} ${upgradeTarget.name} (${upgradeTarget.price} 🪙) 🎉`);
                } else {
                    inventory.splice(selectedInvIndex, 1);
                    selectedInvIndex = null;
                    alert(`Невдача! Предмет згорів у колесі фортуни 😢`);
                }
                updateUI();
                wheel.style.transform = `rotate(0deg)`;
                updateWheelGradient(document.getElementById('chanceSlider').value);
            }, 4100);
        }

        function activatePromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            if (activeCodes[code] !== undefined) {
                balance += activeCodes[code];
                alert(`Промокод успішно активовано! Отримано ${activeCodes[code]} монет 🪙`);
                delete activeCodes[code];
                updateUI();
            } else {
                alert('Невірний або вже використаний промокод! ❌');
            }
        }

        // Перевірка коду для адмінки
        function checkAdminCode() {
            const inputVal = document.getElementById('admin-code-input').value.trim();
            if (inputVal === '6785431923') {
                isAdminLoggedIn = true;
                localStorage.setItem('brainrot_admin_auth', 'true');
                updateAdminPanel();
                alert('Доступ дозволено! Вітаю в адмін-панелі 🔥');
            } else {
                alert('Невірний код доступу! ❌');
            }
        }

        function renderAdminPanel() {
            updateAdminPanel();
        }

        function updateAdminPanel() {
            const container = document.getElementById('admin-panel-container');
            
            // Якщо не авторизований — показуємо форму вводу коду
            if (!isAdminLoggedIn) {
                container.innerHTML = `
                    <div class="panel-card" style="text-align: center; gap: 12px; padding: 20px;">
                        <p style="font-size: 13px; color: var(--text-sub);">Введіть секретний код для адмін-доступу:</p>
                        <input type="password" id="admin-code-input" class="input-field" placeholder="Введіть код..." style="text-align: center;">
                        <button class="btn-primary" onclick="checkAdminCode()">Увійти в адмінку 🔓</button>
                    </div>
                `;
                return;
            }

            let otherPlayers = activePlayers.filter(p => p.username !== tgUser);

            let onlineRows = '';
            if (otherPlayers.length === 0) {
                onlineRows = `<div style="text-align:center; padding:8px; color:var(--text-sub); font-size:11px;">У мережі немає інших гравців 🟢</div>`;
            } else {
                onlineRows = otherPlayers.map((p, idx) => `
                    <div class="online-user-row">
                        <div><b>@${p.username}</b><br><span style="color:var(--gold)">${p.balance} 🪙</span></div>
                        <div class="admin-actions">
                            <button class="btn-mini" onclick="adminCustomCoins('${p.username}')">±</button>
                            <button class="btn-mini" style="background:#ef4444; color:white;" onclick="adminResetBalance('${p.username}')">0🪙</button>
                            <button class="btn-mini" style="background:#ef4444; color:white;" onclick="adminClearInventory('${p.username}')">🎒0</button>
                            <button class="btn-mini" style="background:#38bdf8;" onclick="adminGiveCase('${p.username}')">+Кейс</button>
                        </div>
                    </div>
                `).join('');
            }

            let withdrawRows = '';
            if (withdrawRequests.length === 0) {
                withdrawRows = `<div style="text-align:center; padding:8px; color:var(--text-sub); font-size:11px;">Немає запитів на вивід 📭</div>`;
            } else {
                withdrawRows = withdrawRequests.map((req, idx) => `
                    <div class="online-user-row" style="border-color:var(--gold);">
                        <div><b>@${req.user}</b> виводить: <span style="color:var(--gold);">${req.itemIcon} ${req.itemName}</span><br><span style="font-size:10px; color:var(--text-sub);">${req.date}</span></div>
                        <button class="btn-mini" style="background:var(--green); color:white;" onclick="completeWithdraw(${idx})">Видано ✅</button>
                    </div>
                `).join('');
            }

            container.innerHTML = `
                <div class="panel-card" style="gap:10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <p style="font-size: 13px; font-weight: 800; color: var(--gold);">🛠️ Панель управління</p>
                        <button class="btn-mini" style="background: var(--red); color: white;" onclick="adminLogout()">Вийти</button>
                    </div>
                    <hr style="border-color: var(--border);">
                    <p style="font-size: 13px; font-weight: 800; color: var(--gold);">📦 Запити на вивід (${withdrawRequests.length})</p>
                    <div style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto;">
                        ${withdrawRows}
                    </div>
                    <hr style="border-color: var(--border);">
                    <p style="font-size: 13px; font-weight: 800; color: var(--gold);">👑 Гравці онлайн</p>
                    <div style="display:flex; flex-direction:column; gap:6px; max-height:130px; overflow-y:auto;">
                        ${onlineRows}
                    </div>
                    <hr style="border-color: var(--border);">
                    <p style="font-size: 12px; font-weight: 700; color: var(--text-sub);">Створити промокод:</p>
                    <input type="text" id="new-promo-name" class="input-field" placeholder="Назва промокоду">
                    <input type="number" id="new-promo-sum" class="input-field" placeholder="Сума монет">
                    <button class="btn-primary" onclick="adminCreatePromo()">Створити промокод 🎟️</button>
                </div>
            `;
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            localStorage.removeItem('brainrot_admin_auth');
            updateAdminPanel();
        }

        function adminResetBalance(username) {
            if (!isAdminLoggedIn) return;
            if (!confirm(`Точно обнулити баланс гравцю @${username}?`)) return;
            let p = activePlayers.find(x => x.username === username);
            if (p) {
                p.balance = 0;
                if (username === tgUser) balance = 0;
                localStorage.setItem('brainrot_online_players', JSON.stringify(activePlayers));
                updateUI();
                alert(`Баланс гравця @${username} обнулено! 🪙`);
            }
        }

        function adminClearInventory(username) {
            if (!isAdminLoggedIn) return;
            if (!confirm(`Точно очистити всі брейнроти у гравця @${username}?`)) return;
            let p = activePlayers.find(x => x.username === username);
            if (p) {
                p.inventoryCount = 0;
                if (username === tgUser) {
                    inventory = [];
                }
                localStorage.setItem('brainrot_online_players', JSON.stringify(activePlayers));
                updateUI();
                alert(`Інвентар брейнротів гравця @${username} повністю очищено! 🎒`);
            }
        }

        function completeWithdraw(index) {
            if (!isAdminLoggedIn) return;
            withdrawRequests.splice(index, 1);
            localStorage.setItem('brainrot_withdraws', JSON.stringify(withdrawRequests));
            updateUI();
            alert('Запит на вивід успішно оброблено і видалено! 👍');
        }

        function adminCustomCoins(username) {
            if (!isAdminLoggedIn) return;
            let amount = prompt(`Введіть кількість монет для додавання (або мінус для зняття) гравцю @${username}:`, "100");
            if (amount === null) return;
            let val = parseInt(amount);
            if (isNaN(val)) {
                alert("Введіть коректне число!");
                return;
            }
            let p = activePlayers.find(x => x.username === username);
            if (p) {
                p.balance = Math.max(0, p.balance + val);
                if (username === tgUser) balance = p.balance;
                localStorage.setItem('brainrot_online_players', JSON.stringify(activePlayers));
                updateUI();
                alert(`Баланс гравця @${username} успішно змінено на ${val > 0 ? '+' + val : val} 🪙!`);
            }
        }

        function adminGiveCase(username) {
            if (!isAdminLoggedIn) return;
            let caseNames = casesList.map((c, i) => `${i+1}. ${c.name} (${c.price}🪙)`).join('\n');
            let choice = prompt(`Виберіть номер кейсу для видачі гравцю @${username}:\n\n${caseNames}`, "1");
            if (choice === null) return;
            let index = parseInt(choice) - 1;
            if (isNaN(index) || !casesList[index]) {
                alert("Невірний вибір кейсу!");
                return;
            }
            let chosenCase = casesList[index];
            let randomDrop = getBetterRandomDrop(chosenCase.price);
            if (username === tgUser) {
                inventory.push(randomDrop);
            }
            updateUI();
            alert(`Гравцю @${username} успішно видано кейс "${chosenCase.name}"! Випав предмет: ${randomDrop.icon} ${randomDrop.name} 🎉`);
        }

        function adminCreatePromo() {
            if (!isAdminLoggedIn) return;
            const name = document.getElementById('new-promo-name').value.trim().toUpperCase();
            const sum = parseInt(document.getElementById('new-promo-sum').value);
            if (!name || isNaN(sum)) {
                alert('Заповніть коректно дані промокоду!');
                return;
            }
            activeCodes[name] = sum;
            localStorage.setItem('brainrot_codes', JSON.stringify(activeCodes));
            alert(`Промокод "${name}" на ${sum} монет успішно створено! 🔥`);
            document.getElementById('new-promo-name').value = '';
            document.getElementById('new-promo-sum').value = '';
        }

        updateWheelGradient(50);
        updateUI();
    </script>
